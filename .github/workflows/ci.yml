name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  INVENTORY_TEST_DATABASE_URL: postgresql://inventory:inventory@localhost:5433/inventory_desktop_test

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Create test database
        env:
          PGPASSWORD: inventory
        run: psql -h localhost -p 5433 -U inventory -d inventory -c 'CREATE DATABASE inventory_desktop_test'

      - name: go test
        run: go test ./... -count=1

      - name: go test -race
        run: go test -race ./... -count=1

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l internal cmd main.go app.go)"

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        working-directory: frontend
        run: pnpm lint

      - name: pnpm test
        working-directory: frontend
        run: pnpm test

      - name: pnpm build
        working-directory: frontend
        run: pnpm build

      - name: pnpm audit
        working-directory: frontend
        run: pnpm audit --audit-level=high
